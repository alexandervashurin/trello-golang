name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.x'
          cache: true

      - name: Build
        run: go build -o trello-golang -ldflags="-s -w" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: trello-golang
          generate_release_notes: true
